<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="upload.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Upload · pics</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="./">pics<span>.</span></a>
    <nav class="site-nav">
      <a href="./">Random</a>
      <a href="gallery.html">Gallery</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>
  <main class="upload">
    <h1>Upload</h1>

    <section id="key-section">
      <label for="key">Upload key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="64 hex characters">
      <div class="row">
        <button id="save-key" class="btn secondary" type="button">Save key</button>
        <button id="forget-key" class="btn secondary" type="button" hidden>Forget key</button>
      </div>
      <p class="hint">The <code>UPLOAD_KEY</code> secret set on the upload Worker. Stored on this device only.</p>
      <p id="key-status" class="status" role="status"></p>
    </section>

    <section id="upload-section" hidden>
      <label class="picker">
        <input id="files" type="file" accept="image/*" multiple>
        <span>Tap to choose photos</span>
      </label>
      <ul class="previews" id="previews"></ul>
      <div class="row">
        <button id="upload" class="btn" type="button" disabled>Upload</button>
        <button id="clear" class="btn secondary" type="button" hidden>Clear</button>
      </div>
      <p class="hint">Photos are converted to WebP at up to 2560&nbsp;px and all metadata (including GPS location) is removed on this device before upload.</p>
      <p id="upload-status" class="status" role="status"></p>
    </section>
  </main>
  <script type="module" src="assets/js/theme.js"></script>
  <script type="module" src="assets/js/upload.js"></script>
</body>
</html>
