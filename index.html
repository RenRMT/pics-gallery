<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/IBMPlexSans-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">

<body>

        <span class="switch" aria-hidden="true"></span><span class="label">Light</span>

    </nav>
  </header>
  <main class="random">

  <script type="module" src="assets/js/theme.js"></script>
